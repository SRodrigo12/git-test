<body>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcQ1il5snKXgNfK_dXI3y4GEatkQyUle_VZGFusOlpF-nvFIMv2g0pSLpKXcgKpp_XOVt0-m5NY-8NzCTKv6KXoOgmzcJHGC64czlMMq7ylxm2NxzqsBx44BX1LYI0STAboYmVBSZBZmpw&usqp=CAc"

            <p>Lego Onibus Espacial</p>
            <p>R$150,00</p>
            <button>Comprar</button>


        </div>
