<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    body {
      background-color: hsl(212, 45%, 89%);
      display: flex;
      /* 1. Ativa o modo flex */
      justify-content: center;
      /* 2. Alinha na horizontal */
      align-items: center;
      /* 3. Alinha na vertical */
      min-height: 100vh;
      /* Extra: Garante que o body usa a altura da tela toda */
      flex-direction: column;
    }

    .container {
      width: 300px;
      height: auto;
      background-color: hsl(240, 11%, 98%);
      border-radius: 15px;
      padding: 20px;
      padding-top: 0;
      padding-bottom: 20px;
      text-align: center;
      margin-top: auto;

    }

    #qr-code {
      width: 250px;
      border-radius: 10px;
    }

    #p1 {
      color: rgb(0, 0, 43);
      font-weight: 700;
      font-family: sans-serif;
      font-size: 15px;

    }

    #p2 {
      color: hsl(213, 7%, 68%);
      font-weight: 700;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      ;
      font-size: 15px;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <p id="p1"><img id="qr-code" src="images/image-qr-code.png" alt="qr-code">
      Improve your front-end skills by building projects</p>
    <p id="p2">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>



  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">SRodrigo</a>.
  </footer>
</body>

</html>
